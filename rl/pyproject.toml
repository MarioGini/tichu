[project]
name = "tichu-rl"
version = "0.1.0"
description = "PyTorch RL training for Tichu AI"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "tensorboard>=2.14",
    "tqdm>=4.65",
    "safetensors>=0.4",
    "torch-directml>=0.2.5.dev240914",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
