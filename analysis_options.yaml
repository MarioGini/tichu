include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unnecessary_import: error
    unused_import: error
    unused_local_variable: error
    dead_code: error
    avoid_print: error

linter:
  rules:
    public_member_api_docs: false