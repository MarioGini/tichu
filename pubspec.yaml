name: tichu
description: A new Flutter project.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  meta: ^1.19.0
  postgres: ^3.7.0
  shared_preferences: ^2.5.6
  supabase: ^2.16.5
  supabase_flutter: ^2.18.3

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:

  uses-material-design: true # Required if you use the Material icon font

  assets:
    - assets/cards/
    - assets/sfx/
    - assets/bots/tichu_q_v10.safetensors
    - assets/bots/tichu_schupf_v5.safetensors
    - assets/bots/tichu_belief_v1.safetensors
