[project]
name = "tichu-rl"
version = "0.1.0"
description = "PyTorch RL training for Tichu AI"
# The RL tooling is supported on Linux only (see [tool.uv] environments).
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "safetensors>=0.8.0",
    "torch>=2.15.0",
]

[tool.uv]
# Scripts are run in place (`uv run --project rl python rl/<script>.py`);
# there is no package to build or install.
package = false
# Linux is the only supported dev environment for RL: lock and resolve for
# Linux only, so uv refuses to sync on other platforms.
environments = ["sys_platform == 'linux'"]

# Training runs on CPU; PyPI's Linux torch wheels pull in ~4 GB of CUDA
# libraries, so torch comes from PyTorch's CPU-only index instead.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
