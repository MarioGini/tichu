<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#1c7a50"/>
      <stop offset="0.55" stop-color="#0f5d3d"/>
      <stop offset="1" stop-color="#07301f"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#efe3c8"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f"/>
      <stop offset="0.5" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#c8102e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffd23f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#000" flood-opacity="0.45"/>
    </filter>

    <!-- Card frame, 200 x 290, origin at the card's centre. -->
    <g id="card">
      <rect x="-100" y="-145" width="200" height="290" rx="20" fill="url(#paper)" stroke="#b8963e" stroke-width="4"/>
      <rect x="-86" y="-131" width="172" height="262" rx="11" fill="none" stroke="#c9a54a" stroke-width="2"/>
    </g>

    <!-- Dragon: a coiled green serpent with a golden belly and red fins. -->
    <g id="dragon">
      <use href="#card"/>
      <rect x="-78" y="-123" width="156" height="246" rx="8" fill="#ffe27a"/>
      <circle cx="0" cy="0" r="70" fill="#ffcf33" opacity="0.55"/>
      <g transform="scale(-1 1)">
      <!-- dorsal fins -->
      <path d="M -75.8 94.8 L -92.4 82.8 L -77.5 80.9 Z M -74.4 69.2 L -78.9 49.1 L -66.5 57.6 Z M -58.2 50.5 L -53.9 30.5 L -46.2 43.3 Z M -42.3 41.6 L -34.0 22.8 L -29.1 37.0 Z M -24.5 35.8 L -13.2 18.7 L -10.7 33.5 Z M -6.1 33.1 L 8.2 18.4 L 7.9 33.4 Z M 11.8 34.5 L 26.1 19.8 L 25.8 34.8 Z M 25.6 35.1 L 34.1 16.5 L 38.9 30.7 Z M 36.2 32.8 L 34.3 12.4 L 45.5 22.3 Z M 43.7 26.5 L 29.9 11.3 L 44.9 12.6 Z M 45.6 16.4 L 25.6 11.6 L 38.7 4.2 Z M 40.9 6.8 L 21.0 11.7 L 29.2 -0.9 Z M 28.9 -0.7 L 12.9 12.1 L 15.0 -2.7 Z M 10.3 -2.8 L -6.5 9.0 L -3.4 -5.7 Z M -7.2 -6.8 L -25.9 1.6 L -20.1 -12.2 Z M -24.8 -14.9 L -45.2 -12.2 L -35.7 -23.8 Z M -41.9 -31.8 L -60.8 -39.7 L -46.8 -45.0 Z M -47.2 -55.1 L -58.2 -72.4 L -43.7 -68.6 Z" fill="#d7261e" stroke="#8a1010" stroke-width="2" stroke-linejoin="round"/>
      <!-- tail tuft -->
      <path d="M -52 108 l -22 10 l 18 2 l -8 16 l 20 -18 z" fill="#d7261e" stroke="#8a1010" stroke-width="2" stroke-linejoin="round"/>
      <!-- body: outline, green, golden belly scales -->
      <path d="M -52 108 C -92 70, -30 40, 10 46 C 70 54, 70 -10, 20 -14 C -30 -18, -50 -50, -22 -78" fill="none" stroke="#0d4a1d" stroke-width="36" stroke-linecap="round"/>
      <path d="M -52 108 C -92 70, -30 40, 10 46 C 70 54, 70 -10, 20 -14 C -30 -18, -50 -50, -22 -78" fill="none" stroke="#24903d" stroke-width="30" stroke-linecap="round"/>
      <path d="M -52 108 C -92 70, -30 40, 10 46 C 70 54, 70 -10, 20 -14 C -30 -18, -50 -50, -22 -78" fill="none" stroke="#ffcf33" stroke-width="11" stroke-linecap="butt" stroke-dasharray="9 3"/>
      <!-- head -->
      <g transform="translate(-16 -86) rotate(-8)">
        <!-- mane -->
        <path d="M -16 4 l -26 -10 l 12 14 l -26 4 l 24 10 l -16 14 l 30 -12 z" fill="#d7261e" stroke="#8a1010" stroke-width="2" stroke-linejoin="round"/>
        <!-- horns -->
        <path d="M -4 -18 C -14 -40, -30 -46, -44 -44 C -30 -38, -22 -28, -16 -12 Z" fill="#ffcf33" stroke="#a06a00" stroke-width="2"/>
        <path d="M 6 -20 C 4 -42, -6 -54, -18 -60 C -6 -48, -4 -34, -4 -18 Z" fill="#ffcf33" stroke="#a06a00" stroke-width="2"/>
        <path d="M -20 10 C -22 -12, 0 -24, 22 -20 L 58 -14 L 46 -4 L 60 2 L 30 6 L 50 18 L 16 18 C 4 26, -14 24, -20 10 Z"
              fill="#24903d" stroke="#0d4a1d" stroke-width="3" stroke-linejoin="round"/>
        <path d="M 36 -9 l 3 6 l 3 -6 M 44 -8 l 3 6 l 3 -6" fill="#fff"/>
        <!-- whiskers -->
        <path d="M 56 -12 C 74 -30, 78 -6, 92 -22" fill="none" stroke="#d7261e" stroke-width="4" stroke-linecap="round"/>
        <path d="M 46 16 C 64 30, 74 14, 90 30" fill="none" stroke="#d7261e" stroke-width="4" stroke-linecap="round"/>
        <circle cx="14" cy="-6" r="7" fill="#fff" stroke="#0d4a1d" stroke-width="1.5"/>
        <circle cx="16" cy="-6" r="4" fill="#111"/>
      </g>
      </g>
    </g>

    <!-- Phoenix: a fire bird with raised wings and long flowing tail. -->
    <g id="phoenix">
      <use href="#card"/>
      <rect x="-78" y="-123" width="156" height="246" rx="8" fill="#1d3f7a"/>
      <circle cx="0" cy="-30" r="80" fill="url(#glow)"/>
      <!-- tail feathers -->
      <path d="M -4 20 C -40 60, -70 70, -56 112 C -50 90, -30 76, -20 70 C -30 90, -24 108, -6 118 C -12 96, -4 80, 4 70 C 6 92, 20 106, 40 110 C 26 92, 22 74, 18 58 C 34 70, 50 70, 64 90 C 56 60, 34 44, 10 24 Z"
            fill="url(#fire)" stroke="#7a0a1a" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- left wing -->
      <path d="M -8 -10 C -40 -14, -70 -50, -72 -104 C -58 -84, -50 -86, -44 -96 C -42 -76, -32 -74, -24 -86 C -24 -60, -10 -50, 0 -40 Z"
            fill="url(#fire)" stroke="#7a0a1a" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- right wing -->
      <path d="M 8 -10 C 40 -14, 70 -50, 72 -104 C 58 -84, 50 -86, 44 -96 C 42 -76, 32 -74, 24 -86 C 24 -60, 10 -50, 0 -40 Z"
            fill="url(#fire)" stroke="#7a0a1a" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- body -->
      <path d="M 0 -52 C 16 -40, 20 -10, 12 14 C 8 26, -8 26, -12 14 C -20 -10, -16 -40, 0 -52 Z"
            fill="#c8102e" stroke="#7a0a1a" stroke-width="2.5"/>
      <!-- neck and head -->
      <path d="M -4 -44 C -8 -62, 0 -76, 10 -80 C 20 -82, 26 -76, 26 -70 L 40 -66 L 26 -62 C 22 -54, 12 -50, 6 -40 Z"
            fill="#ff7a1a" stroke="#7a0a1a" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- crest -->
      <path d="M 8 -80 C 2 -96, 8 -106, 18 -110 C 12 -100, 14 -94, 20 -90 C 20 -100, 28 -106, 36 -106 C 28 -98, 26 -88, 22 -78 Z"
            fill="#ffd23f" stroke="#7a0a1a" stroke-width="2"/>
      <circle cx="16" cy="-70" r="3.5" fill="#111"/>
    </g>
  </defs>

  <rect width="512" height="512" fill="url(#felt)"/>
  <g filter="url(#shadow)">
    <use href="#phoenix" transform="translate(182 262) rotate(-14)"/>
    <use href="#dragon" transform="translate(330 262) rotate(12)"/>
  </g>
</svg>
