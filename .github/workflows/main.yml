name: CI

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Format & Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      - run: dart format --output=none --set-exit-if-changed .
      # --fatal-infos fails on every lint, so this also covers `dart fix`.
      - run: flutter analyze --fatal-infos --fatal-warnings

  test:
    name: Test (${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-flutter
      # Split by file, not with --total-shards: that splits test cases, so
      # every shard would still compile all files (most of the test time).
      - run: >-
          flutter test $(find test -name '*_test.dart' | sort
          | awk -v s=${{ matrix.shard }} 'NR % 2 == s - 1')

  build:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [web, linux]
    steps:
      - uses: actions/checkout@v7
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - uses: ./.github/actions/setup-flutter
      - if: matrix.target == 'linux'
        run: flutter build linux
      # The web build doubles as the GitHub Pages bundle, so it is built with
      # the Pages base href and uploaded for the deploy job.
      # The Supabase project (accounts, game records). The URL and the
      # publishable key are public by design (they ship in the web bundle;
      # row-level security guards the data), so they are set here; the
      # SUPABASE_URL / SUPABASE_ANON_KEY repository secrets override them.
      - if: matrix.target == 'web'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://fujbfizzxdxufetszvbe.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable__pP-bB_x1sOf_wwsr0m-Qw_GJA9freO' }}
        # --no-wasm-dry-run: the default extra wasm compile only prints
        # compatibility warnings (~12 s of a ~55 s build).
        run: >-
          flutter build web --base-href "/${{ github.event.repository.name }}/"
          --no-wasm-dry-run
          --dart-define=SUPABASE_URL="$SUPABASE_URL"
          --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
      - if: matrix.target == 'web'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/web

  deploy:
    name: Deploy Pages
    # Only deploy develop, and only after analyze, tests and builds passed.
    if: github.ref == 'refs/heads/develop' && github.event_name != 'pull_request'
    needs: [analyze, test, build]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
