# Fly.io config for the Tichu authority server.
app = "tichu-authority"
primary_region = "fra" # Frankfurt, closest Fly region to Supabase eu-central-2 (Zurich)

[build]
  dockerfile = "Dockerfile"

[env]
  SUPABASE_URL = "https://fujbfizzxdxufetszvbe.supabase.co"

[http_service]
  internal_port = 8080
  force_https = true
  # Matches live in memory: never stop or scale the single machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
