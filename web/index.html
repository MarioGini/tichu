<!DOCTYPE html>
<html>

<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Tichu, the climbing card game for four. Play against AI or with friends.">
  <meta name="theme-color" content="#0D3B2C">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Tichu">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>Tichu</title>
  <link rel="manifest" href="manifest.json">

</head>

<body style="margin:0; background:#0d3b2c;">
  <div id="loading" style="position:fixed; inset:0; display:flex; align-items:center; justify-content:center; font-family: Roboto, Arial, sans-serif; letter-spacing:6px; font-weight:900; font-size:32px; color:#ffffff; background:radial-gradient(circle at 50% 35%, #1c7a50, #0f5d3d 55%, #07301f);">TICHU</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
    window.addEventListener('load', function () {
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) {
              registration.unregister();
            });
          });
        }
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
